name: portable-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: native-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DOPENCUDA_BUILD_TESTS=ON -DOPENCUDA_ENABLE_LEGACY_CUDA=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  linux-clang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Configure
        run: CC=clang CXX=clang++ cmake -S . -B build-clang -DOPENCUDA_BUILD_TESTS=ON -DOPENCUDA_ENABLE_LEGACY_CUDA=OFF
      - name: Build
        run: cmake --build build-clang --config Release --parallel
      - name: Test
        run: ctest --test-dir build-clang -C Release --output-on-failure

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: python -m ruff check python scripts
      - name: Mypy
        run: python -m mypy python/opencuda
      - name: Pytest
        run: python -m pytest

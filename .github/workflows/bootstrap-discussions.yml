name: bootstrap-discussions

on:
  workflow_dispatch:

permissions:
  contents: read
  discussions: write

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify categories and create seed discussions
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const name = context.repo.repo;
            const contract = JSON.parse(fs.readFileSync('config/discussion-categories.json', 'utf8'));
            const expected = contract.categories;
            const query = `query($owner:String!, $name:String!) {
              repository(owner:$owner, name:$name) {
                id
                discussionCategories(first:50) { nodes { id name slug isAnswerable } }
                discussions(first:100) { nodes { title } }
              }
            }`;
            const data = await github.graphql(query, { owner, name });
            const repo = data.repository;
            const actualCategories = [...repo.discussionCategories.nodes]
              .sort((left, right) => left.slug.localeCompare(right.slug));
            const observed = actualCategories
              .map(category => `${category.slug} => ${category.name} (answerable=${category.isAnswerable})`)
              .join('; ');
            core.info(`Observed Discussion categories (${actualCategories.length}): ${observed}`);

            const bySlug = new Map(actualCategories.map(category => [category.slug, category]));
            const missing = expected.filter(category => !bySlug.has(category.slug));
            if (missing.length) {
              core.setFailed(
                `Missing Discussion categories: ${missing.map(category => category.slug).join(', ')}. ` +
                `Observed: ${observed}`,
              );
              return;
            }
            for (const category of expected) {
              const actual = bySlug.get(category.slug);
              if (actual.name !== category.name) {
                core.setFailed(
                  `Discussion category ${category.slug} has name ${actual.name}, expected ${category.name}. ` +
                  `Observed: ${observed}`,
                );
                return;
              }
              const shouldAnswer = category.format === 'question-and-answer';
              if (actual.isAnswerable !== shouldAnswer) {
                core.setFailed(
                  `Discussion category ${category.slug} answerable=${actual.isAnswerable}, expected ${shouldAnswer}. ` +
                  `Observed: ${observed}`,
                );
                return;
              }
            }

            const existing = new Set(repo.discussions.nodes.map(discussion => discussion.title));
            const mutation = `mutation($repositoryId:ID!, $categoryId:ID!, $title:String!, $body:String!) {
              createDiscussion(input:{repositoryId:$repositoryId, categoryId:$categoryId, title:$title, body:$body}) {
                discussion { url }
              }
            }`;
            for (const category of expected) {
              if (!category.seed || existing.has(category.seed.title)) continue;
              const result = await github.graphql(mutation, {
                repositoryId: repo.id,
                categoryId: bySlug.get(category.slug).id,
                title: category.seed.title,
                body: category.seed.body,
              });
              core.info(`Created: ${result.createDiscussion.discussion.url}`);
            }

name: content-moderation

on:
  discussion:
    types: [created, edited]
  discussion_comment:
    types: [created, edited]
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  pull_request:
    types: [opened, edited]
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited]
  workflow_dispatch:

permissions:
  contents: read
  discussions: write
  issues: write
  pull-requests: read

jobs:
  moderate:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan event payload without shell interpolation
        run: >-
          python -m scripts.ci.moderate_event
          --event "$GITHUB_EVENT_PATH"
          --event-name "$GITHUB_EVENT_NAME"
          --output moderation-result.json
      - name: Route moderation findings
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const result = JSON.parse(fs.readFileSync('moderation-result.json', 'utf8'));
            if (result.actor === 'github-actions[bot]') return;

            const marker = `<!-- opencuda-moderation:${result.source_key} -->`;
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = openIssues.find(
              item => !item.pull_request && (item.body || '').includes(marker),
            );

            if (!result.requires_review) {
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body: 'Automated re-scan no longer finds content-policy triggers. Closing the moderation review.',
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  state: 'closed',
                  state_reason: 'completed',
                });
              }
              return;
            }

            const categories = [...new Set(result.findings.map(item => item.category))];
            const severities = [...new Set(result.findings.map(item => item.severity))];
            const rules = [...new Set(result.findings.map(item => item.rule_id))];
            const reviewBody = [
              marker,
              '## Automated moderation review',
              '',
              `- Source: ${result.url || 'unavailable'}`,
              `- Actor: @${result.actor}`,
              `- Source type: ${result.source_kind}`,
              `- Categories: ${categories.join(', ')}`,
              `- Severities: ${severities.join(', ')}`,
              `- Rule IDs: ${rules.join(', ')}`,
              `- Content SHA-256: \`${result.content_sha256}\``,
              '',
              'The original text/media is intentionally not copied into this issue. Review the linked source in context.',
              'Text findings are deterministic policy matches. Embedded media is routed for human review because this local scanner does not inspect image/video pixels.',
            ].join('\n');

            let reviewIssue = existing;
            if (!reviewIssue) {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Moderation review: ${result.source_key}`,
                body: reviewBody,
                labels: [
                  'operational',
                  'discussion',
                  'role',
                  'role:community-moderator',
                ],
              });
              reviewIssue = created.data;
            } else {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: reviewIssue.number,
                body: reviewBody,
              });
            }

            if (!result.blocking) return;
            const notice = [
              'This content triggered the openCUDA automated collaboration-content policy and has been routed for moderator review.',
              'Please edit the post/comment to remove prohibited language or explicit adult material.',
              `Review tracking: #${reviewIssue.number}.`,
              'No offending excerpt is repeated here.',
            ].join(' ');

            if (result.source_kind === 'discussion' || result.source_kind === 'discussion_comment') {
              await github.graphql(
                `mutation($discussionId:ID!, $body:String!) {
                  addDiscussionComment(input:{discussionId:$discussionId, body:$body}) { comment { id } }
                }`,
                { discussionId: result.parent_node_id, body: notice },
              );
            } else if (result.parent_number) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: result.parent_number,
                body: notice,
              });
            }

  self-test:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run deterministic moderation tests
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest python/tests/test_content_policy.py python/tests/test_moderate_event.py

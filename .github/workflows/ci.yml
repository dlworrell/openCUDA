name: portable-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: native-${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: macos-arm64
            os: macos-15
          - name: macos-x86_64
            os: macos-15-intel
          - name: windows-x86_64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: >-
          cmake -S . -B build
          -DOPENCUDA_BUILD_TESTS=ON
          -DOPENCUDA_ENABLE_LEGACY_CUDA=OFF
          -DOPENCUDA_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  linux-clang:
    name: native-linux-x86_64-clang
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install Clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Configure
        run: >-
          CC=clang CXX=clang++ cmake -S . -B build-clang
          -DOPENCUDA_BUILD_TESTS=ON
          -DOPENCUDA_ENABLE_LEGACY_CUDA=OFF
          -DOPENCUDA_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build-clang --config Release --parallel
      - name: Test
        run: ctest --test-dir build-clang -C Release --output-on-failure

  linux-aarch64-cross:
    name: compile-linux-aarch64
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install AArch64 cross toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
      - name: Configure AArch64 compile-only build
        run: >-
          cmake -S . -B build-aarch64
          -DCMAKE_SYSTEM_NAME=Linux
          -DCMAKE_SYSTEM_PROCESSOR=aarch64
          -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc
          -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++
          -DOPENCUDA_BUILD_TESTS=OFF
          -DOPENCUDA_ENABLE_LEGACY_CUDA=OFF
          -DOPENCUDA_WARNINGS_AS_ERRORS=ON
      - name: Build AArch64 including assembly
        run: cmake --build build-aarch64 --config Release --parallel

  python:
    name: python-${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: python -m ruff check python scripts
      - name: Mypy
        run: python -m mypy python/opencuda
      - name: Pytest
        run: python -m pytest

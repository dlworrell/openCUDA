name: Bug report
description: Report a reproducible defect in openCUDA.
title: '[Bug] '
labels:
- bug
- developmental
- role
- role:code-reviewer
body:
- type: markdown
  attributes:
    value: Use Discussions for exploratory questions. File an issue when there is a reproducible defect or incorrect documented behavior.
- type: dropdown
  id: area
  attributes:
    label: Primary area
    description: Where does the defect occur?
    options:
    - Portable C core / ABI
    - C++ layer
    - Python
    - Assembly
    - Legacy CUDA / Kepler backend
    - Build / CMake
    - CI / Actions
    - Diagnostics / tooling
    - Documentation
    - Other
  validations:
    required: true
- type: dropdown
  id: platform
  attributes:
    label: Platform
    description: Where is the problem observed?
    options:
    - Linux x86-64
    - Linux AArch64
    - macOS x86-64
    - macOS arm64
    - Windows x86-64
    - DL380p/CUBIX/K80 reference node
    - Other / multiple
  validations:
    required: true
- type: input
  id: version
  attributes:
    label: Version / commit
    description: Release, tag, branch, or commit SHA.
  validations:
    required: true
- type: textarea
  id: expected
  attributes:
    label: Expected behavior
    description: What should happen?
  validations:
    required: true
- type: textarea
  id: actual
  attributes:
    label: Actual behavior
    description: What happened instead?
  validations:
    required: true
- type: textarea
  id: repro
  attributes:
    label: Minimal reproduction
    description: Provide exact commands, code, inputs, and environment needed to reproduce.
  validations:
    required: true
- type: textarea
  id: logs
  attributes:
    label: Relevant logs / diagnostics
    description: Paste concise logs or attach diagnostic output. Remove secrets.
  validations:
    required: false
- type: checkboxes
  id: confirm
  attributes:
    label: Confirmation
    options:
    - label: I searched existing Issues and Discussions for duplicates.
      required: true
    - label: I have removed secrets, tokens, personal data, and proprietary NVIDIA artifacts from the report.
      required: true

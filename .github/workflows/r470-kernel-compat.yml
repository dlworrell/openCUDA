name: R470 kernel compatibility

on:
  pull_request:
    paths:
      - 'patches/nvidia-r470/**'
      - 'scripts/r470/**'
      - '.github/workflows/r470-kernel-compat.yml'
  push:
    branches: [main]
    paths:
      - 'patches/nvidia-r470/**'
      - 'scripts/r470/**'
      - '.github/workflows/r470-kernel-compat.yml'
  workflow_dispatch:
    inputs:
      hardware_build:
        description: 'Request hardware build (blocked; use local operator procedure)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  metadata:
    name: Series integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify series metadata
        run: sh scripts/r470/verify-series.sh
      - name: Verify pinned upstream patch inventory
        run: |
          set -eu
          . patches/nvidia-r470/UPSTREAM
          git clone --quiet --no-checkout "$PATCH_UPSTREAM_REPOSITORY" /tmp/r470-upstream
          git -C /tmp/r470-upstream checkout --quiet --detach "$PATCH_UPSTREAM_COMMIT"
          while IFS= read -r entry || [ -n "$entry" ]; do
            case "$entry" in
              ''|'#'*) continue ;;
              upstream/*)
                test -f "/tmp/r470-upstream/$PATCH_UPSTREAM_PATH/${entry#upstream/}"
                ;;
              local/*)
                test -f "patches/nvidia-r470/$entry"
                ;;
              *) exit 1 ;;
            esac
          done < patches/nvidia-r470/SERIES

  kepler-build:
    name: K80 R470 module build unavailable
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.hardware_build }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Hardware build requires local operator execution
        run: |
          echo "::error::Public-repository lab execution is prohibited. See docs/HARDWARE_EXECUTION_SECURITY.md."
          exit 1
